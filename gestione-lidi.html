<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { accessoConsentito } from "./accesso-staff.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcLeex_9o0BqgAs2lEEXTiVYG_zRSiXQA",
  authDomain: "app-segnalazioni-omnia-roseto.firebaseapp.com",
  databaseURL: "https://app-segnalazioni-omnia-roseto-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "app-segnalazioni-omnia-roseto",
  storageBucket: "app-segnalazioni-omnia-roseto.firebasestorage.app",
  messagingSenderId: "699028105579",
  appId: "1:699028105579:web:cdc0a432083b7fe18d442e",
  measurementId: "G-M3PSWKEYCJ",
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true });
const auth = getAuth(app);

const URL_FUNZIONE = "https://europe-west1-app-segnalazioni-omnia-roseto.cloudfunctions.net/gestisciRichiestaLido";
const URL_STAGIONE = "https://europe-west1-app-segnalazioni-omnia-roseto.cloudfunctions.net/configuraStagione";

const MESI_ESTESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

// --- SICUREZZA: nessun HTML dai dati --------------------------------------
// nomeLido, telefono e chat_id li scrive chi si registra sul bot Telegram:
// sono testo che arriva da fuori, non roba nostra. Infilati in innerHTML
// cosi' come sono, un nome tipo `<img src=x onerror=...>` eseguirebbe codice
// dentro QUESTA pagina — che ha in mano il token dello staff e le Cloud
// Function privilegiate (approva, revoca, messaggio a tutti i lidi, sospendi
// il servizio). Quindi ogni valore che non nasce qui dentro passa da qui.
function testoSicuro(valore) {
  return String(valore == null ? "" : valore)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Il nome vero di ogni lido, tenuto da parte per chat_id. Serve perche' le
// azioni "messaggio" e "rinomina" prima rileggevano il nome dal DOM con
// .textContent: con l'escape attivo (e anche prima, con un nome contenente
// & o <) quel giro restituisce un testo diverso da quello salvato — es.
// "Bagno Sole &amp; Mare" tornava come "Bagno Sole & Mare". Qui invece
// leggiamo sempre il dato originale di Firestore.
const nomiLidi = new Map();

function dataLeggibile(meseGiorno) {
  const [mese, giorno] = String(meseGiorno || "").split("-");
  const indice = parseInt(mese, 10) - 1;
  if (Number.isNaN(indice) || !MESI_ESTESI[indice]) return testoSicuro(meseGiorno || "—");
  return `${parseInt(giorno, 10)} ${MESI_ESTESI[indice]}`;
}

async function chiamaGestioneLido(chatId, azione, nomeLido, testo) {
  const idToken = await auth.currentUser.getIdToken();
  const risposta = await fetch(URL_FUNZIONE, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` },
    body: JSON.stringify({ chatId, azione, nomeLido, testo }),
  });
  if (!risposta.ok) {
    const dati = await risposta.json().catch(() => ({}));
    throw new Error(dati.errore || `Errore ${risposta.status}`);
  }
  return risposta.json();
}

// --- Stato del servizio (pausa invernale) ----------------------------------
// Legge e comanda `statoSistema/stagione` tramite la Cloud Function
// configuraStagione: fuori stagione gli invii automatici (bollettino del
// mattino, avvisi previsionali, allerte radar, alert allo staff) si fermano
// da soli. Qui si può forzare la sospensione prima del previsto o
// riaccendere il servizio fuori stagione, e poi tornare al calendario.

async function chiamaStagione(corpo) {
  const idToken = await auth.currentUser.getIdToken();
  const risposta = await fetch(URL_STAGIONE, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` },
    body: JSON.stringify(corpo || {}),
  });
  if (!risposta.ok) {
    const dati = await risposta.json().catch(() => ({}));
    throw new Error(dati.errore || `Errore ${risposta.status}`);
  }
  return risposta.json();
}

async function caricaStatoStagione() {
  const contenitore = document.getElementById("stato-stagione");

  let stato;
  try {
    ({ stato } = await chiamaStagione({}));
  } catch (errore) {
    contenitore.innerHTML = `<div class="messaggio-stato">Stato del servizio non leggibile: ${testoSicuro(errore.message)}</div>`;
    return;
  }

  const config = stato.config || {};
  const forzato = config.forzatura === "sospeso" || config.forzatura === "attivo";
  const modo = forzato
    ? `forzato a mano su "${testoSicuro(config.forzatura)}"`
    : "segue il calendario";

  contenitore.innerHTML = `
    <div class="riga-stagione">
      <span class="badge-stato ${stato.attivo ? "badge-attivo" : "badge-sospeso"}">${stato.attivo ? "attivo" : "sospeso"}</span>
      <span class="motivo-stagione">${testoSicuro(stato.motivo)}</span>
    </div>
    <div class="dettaglio-stagione mono">
      stagione: ${dataLeggibile(config.inizioStagione)} → ${dataLeggibile(config.fineStagione)} (ultimo giorno compreso)<br>
      messaggi ai lidi: ${dataLeggibile(config.giornoPreavvisoChiusura)} preavviso stop ·
      ${dataLeggibile(config.giornoChiusura)} stop ·
      ${dataLeggibile(config.giornoPreavvisoApertura)} preavviso ripartenza ·
      ${dataLeggibile(config.giornoApertura)} ripartenza<br>
      modo: ${modo}
    </div>
    <div class="dettaglio-stagione">
      Quando è sospeso si fermano bollettino del mattino, avvisi previsionali e allerte radar — sia ai lidi sia allo staff.
      Restano attivi gli avvisi di sistema fermo, le nuove iscrizioni al bot e i messaggi scritti a mano da qui e dalla plancia.
    </div>
    <div class="azioni-stagione">
      <button class="btn-azione btn-calendario" data-forzatura="calendario" ${forzato ? "" : "disabled"}>📅 Segui calendario</button>
      <button class="btn-azione btn-sospendi" data-forzatura="sospeso" ${config.forzatura === "sospeso" ? "disabled" : ""}>⏸ Sospendi ora</button>
      <button class="btn-azione btn-riattiva" data-forzatura="attivo" ${config.forzatura === "attivo" ? "disabled" : ""}>▶️ Riattiva ora</button>
    </div>`;

  contenitore.querySelectorAll(".btn-azione").forEach((bottone) => {
    bottone.addEventListener("click", async () => {
      const scelta = bottone.getAttribute("data-forzatura");
      const conferme = {
        calendario: "Tornare a seguire il calendario stagionale?",
        sospeso: "Sospendere SUBITO tutti gli invii automatici (lidi e staff)?\n\nNessun messaggio viene mandato ai lidi: è solo l'interruttore interno.",
        attivo: "Riattivare SUBITO gli invii automatici, anche se siamo fuori stagione?",
      };
      if (!confirm(conferme[scelta])) return;

      contenitore.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        await chiamaStagione({ forzatura: scelta === "calendario" ? null : scelta });
        await caricaStatoStagione();
      } catch (errore) {
        alert(`Errore: ${errore.message}`);
        await caricaStatoStagione();
      }
    });
  });
}

async function caricaRichieste() {
  const contenitore = document.getElementById("lista-richieste");
  const snap = await getDocs(query(collection(db, "richiesteLidi"), where("stato", "==", "in_attesa_approvazione")));

  if (snap.empty) {
    contenitore.innerHTML = `<div class="messaggio-stato">Nessuna richiesta in attesa.</div>`;
    return;
  }

  contenitore.innerHTML = snap.docs.map((doc) => {
    const dati = doc.data();
    nomiLidi.set(doc.id, dati.nomeLido || "senza nome");
    return `
      <div class="voce-lido" data-chat-id="${testoSicuro(doc.id)}">
        <div class="info-lido">
          <div class="nome-lido">${testoSicuro(dati.nomeLido || "senza nome")}</div>
          <div class="dettaglio-lido mono">chat_id: ${testoSicuro(doc.id)}${dati.richiestoIl ? " · " + testoSicuro(new Date(dati.richiestoIl).toLocaleString("it-IT")) : ""}</div>
          <div class="dettaglio-lido mono">📱 ${dati.telefono ? testoSicuro(dati.telefono) : "<span class=\"telefono-mancante\">non fornito</span>"}</div>
        </div>
        <div class="azioni-lido">
          <button class="btn-azione btn-approva" data-azione="approva">Approva</button>
          <button class="btn-azione btn-rifiuta" data-azione="rifiuta">Rifiuta</button>
        </div>
      </div>`;
  }).join("");

  contenitore.querySelectorAll(".btn-azione").forEach((bottone) => {
    bottone.addEventListener("click", async () => {
      const voce = bottone.closest(".voce-lido");
      const chatId = voce.getAttribute("data-chat-id");
      const azione = bottone.getAttribute("data-azione");
      const nomeLido = nomiLidi.get(chatId) || "senza nome";

      voce.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        await chiamaGestioneLido(chatId, azione, nomeLido);
        await caricaTutto();
      } catch (errore) {
        alert(`Errore: ${errore.message}`);
        voce.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    });
  });
}

async function caricaAttivi() {
  const contenitore = document.getElementById("lista-attivi");
  const snap = await getDocs(query(collection(db, "destinatariLidi"), where("stato", "==", "attivo")));

  if (snap.empty) {

  contenitore.innerHTML = snap.docs.map((doc) => {

          <div class="nome-lido">${testoSicuro(dati.nomeLido || "senza nome")}</div>
          <div class="dettaglio-lido mono">chat_id: ${testoSicuro(doc.id)}${dati.approvatoIl ? " · attivo dal " + testoSicuro(new Date(dati.approvatoIl).toLocaleDateString("it-IT")) : ""}</div>
          <div class="dettaglio-lido mono">📱 ${dati.telefono ? testoSicuro(dati.telefono) : "<span class=\"telefono-mancante\">non fornito</span>"}</div>
        </div>
        <div class="azioni-lido">
          <button class="btn-azione btn-messaggio" data-azione="messaggio">✉️ Messaggio</button>
          ${dati.telefono ? "" : `<button class="btn-azione btn-telefono" data-azione="richiedi_telefono">📱 Richiedi numero</button>`}
          <button class="btn-azione btn-modifica" data-azione="rinomina">Modifica nome</button>
          <button class="btn-azione btn-revoca" data-azione="revoca">Revoca</button>
        </div>
      </div>`;
  }).join("");

  contenitore.querySelectorAll(".btn-azione").forEach((bottone) => {
    bottone.addEventListener("click", async () => {
      const voce = bottone.closest(".voce-lido");
      const chatId = voce.getAttribute("data-chat-id");
      const azione = bottone.getAttribute("data-azione");

        const testoPulito = testo.trim();
        if (!testoPulito) return;
        if (!confirm(`Confermi l'invio a "${nomeLido}"?\n\n${testoPulito}`)) return;

        bottone.disabled = true;
        try {
          await chiamaGestioneLido(chatId, "messaggio", null, testoPulito);
          alert("Messaggio inviato.");
        } catch (errore) {
          alert(`Errore: ${errore.message}`);
        } finally {
          bottone.disabled = false;
        }
        return;
      }

      if (azione === "richiedi_telefono") {
        const nomeLido = nomiLidi.get(chatId) || "senza nome";
        if (!confirm(`Mandare a "${nomeLido}" il messaggio con il pulsante per condividere il numero di telefono?`)) return;

        bottone.disabled = true;
        try {
          await chiamaGestioneLido(chatId, "richiedi_telefono", null, null);
          alert("Richiesta inviata.");
        } catch (errore) {
          alert(`Errore: ${errore.message}`);
          bottone.disabled = false;
        }
        return;
      }

      if (azione === "rinomina") {
        const nomeAttuale = nomiLidi.get(chatId) || "";
        const nomeNuovo = prompt("Nuovo nome da visualizzare per questo lido:", nomeAttuale);
        if (nomeNuovo === null) return; // annullato
        const nomeNuovoPulito = nomeNuovo.trim();
        if (!nomeNuovoPulito || nomeNuovoPulito === nomeAttuale) return;

        bottone.disabled = true;
        try {
          await chiamaGestioneLido(chatId, "rinomina", nomeNuovoPulito);
          await caricaTutto();
        } catch (errore) {
          alert(`Errore: ${errore.message}`);
          bottone.disabled = false;
        }
        return;
      }

      if (!confirm("Revocare l'accesso agli alert per questo lido?")) return;
      bottone.disabled = true;
      try {
        await chiamaGestioneLido(chatId, "revoca", null);
        await caricaTutto();
      } catch (errore) {
        alert(`Errore: ${errore.message}`);
        bottone.disabled = false;
      }
    });
  });
}

async function caricaTutto() {
  await caricaStatoStagione();
  await caricaRichieste();
  await caricaAttivi();
}

setPersistence(auth, browserLocalPersistence).catch(() => {});

onAuthStateChanged(auth, async (utente) => {
  // Non basta essere loggati: questo progetto Firebase e' lo stesso dell'app
  // segnalazioni, quindi "ha un account" non vuol dire "e' dello staff".
  // Se non e' autorizzato, accessoConsentito() mostra da se' il blocco.
  if (!(await accessoConsentito(db, auth, utente))) return;

  document.getElementById("schermata-login").style.display = utente ? "none" : "flex";
  document.getElementById("btn-esci").style.display = utente ? "inline-block" : "none";
  document.getElementById("contenuto-principale").style.display = utente ? "block" : "none";
  if (utente) caricaTutto();
});

document.getElementById("login-bottone").addEventListener("click", async () => {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const erroreEl = document.getElementById("login-errore");
  erroreEl.textContent = "";
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (errore) {
    erroreEl.textContent = "Email o password non corretti.";
  }
});

document.getElementById("login-password").addEventListener("keydown", (evento) => {
  if (evento.key === "Enter") document.getElementById("login-bottone").click();
});

document.getElementById("btn-esci").addEventListener("click", () => signOut(auth));

// --- NAV SCORREVOLE: nasconde la sfumatura a destra a fine scroll ---------
(() => {
  const contenitore = document.getElementById("barra-link-contenitore");
  const barra = document.getElementById("barra-link");
  if (!contenitore || !barra) return;
  const aggiornaFade = () => {
    const fineRaggiunta = barra.scrollLeft + barra.clientWidth >= barra.scrollWidth - 2;
    contenitore.classList.toggle("fine-scroll", fineRaggiunta);
  };
  barra.addEventListener("scroll", aggiornaFade);
  window.addEventListener("resize", aggiornaFade);
  aggiornaFade();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
</script>
